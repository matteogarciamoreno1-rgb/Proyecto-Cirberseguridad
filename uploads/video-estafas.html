const T={paso:$('#paso'),tit:$('#tit'),cap:$('#cap'),est:$('#est'),over:$('#over'),play:$('#play'),time:$('#time'),fill:$('#fill'),track:$('#track')};
STARTS.forEach((s,i)=>{
 const b=document.createElement('button');b.className='btn out';b.textContent=NAMES[i];b.dataset.go=s;
 b.onclick=()=>{started=true;seek(s);if(!playing)play()};$('#chips').insertBefore(b,$('#subs'));
 if(i){const m=document.createElement('div');m.className='mk';m.style.left=(s/D*100)+'%';T.track.appendChild(m)}
});

function render(){
 let sc=0;STARTS.forEach((s,i)=>{if(t>=s)sc=i});
 const lt=t-STARTS[sc],S=SCN[sc];
 SCN.forEach((x,i)=>x.g.style.display=i===sc?'':'none');
 S.g.setAttribute('opacity',ease(clamp(lt/.4)));
 let est='';
 if(sc===0){
  intro.forEach((g,i)=>{const p=ease(clamp((lt-.4-i*.7)/.4));g.setAttribute('opacity',p);g.setAttribute('transform',`translate(${(1-p)*-24} 0)`)});
  est='Siempre el mismo truco, distinto disfraz.';
 }else if(sc===8){
  const p=ease(clamp(lt/.6));sh.setAttribute('transform',`translate(200 120) scale(${2.4*p})`);
  f1.setAttribute('opacity',ease(clamp((lt-.5)/.4)));f2.setAttribute('opacity',ease(clamp((lt-1.2)/.4)));
  est='Conocerlas es la mejor defensa.';
 }else{
  let n=0;S.flags.forEach(f=>{const p=ease(clamp((lt-f.t)/.3));f.g.setAttribute('opacity',p);if(p>=1)n++});
  const k=ease(clamp((lt-2.8)/.4));S.strip.setAttribute('opacity',k);S.strip.setAttribute('transform',`translate(0 ${(1-k)*20})`);
  if(S.ph)S.ph.setAttribute('transform',lt<2.8?`rotate(${Math.sin(lt*28)*2.5} 68 111)`:'');
  est=`Señales de alarma: ${n} de ${S.flags.length}.`;
 }
 T.paso.textContent=PASO[sc];T.tit.textContent=TIT[sc];T.est.textContent=est;
 $('#avx').textContent=AVX[sc];$('#aviso').style.opacity=(AVX[sc]&&lt>=3.4)?1:0;
 let b=0;BEATS.forEach((x,i)=>{if(t>=x[0])b=i});
 T.cap.textContent=BEATS[b][1];
 if(b!==lastBeat){lastBeat=b;if(playing)speak()}
 T.time.textContent=`0:${String(Math.floor(t)).padStart(2,'0')} / 0:42`;
 T.fill.style.width=(t/D*100)+'%';T.track.setAttribute('aria-valuenow',Math.floor(t));
 document.querySelectorAll('[data-go]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.go===STARTS[sc]));
 const ended=t>=D&&!playing;
 T.over.hidden=!(!started||ended);
 $('#bigplay').textContent=ended?'↻ Volver a verlo':'▶ Ver vídeo (42 s)';
 T.play.textContent=playing?'Pausa':(ended?'Repetir':'Reproducir');
}
function speak(){
 if(!narr||!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(BEATS[Math.max(0,lastBeat)][1]);u.lang='es-ES';u.rate=1.05;speechSynthesis.speak(u);
}
function tick(now){
 if(!playing)return;
 t=Math.min(D,t+(now-last)/1000);last=now;
 if(t>=D)playing=false;
 render();
 if(playing)requestAnimationFrame(tick);
}
function play(){if(t>=D)t=0;started=playing=true;last=performance.now();lastBeat=-1;render();speak();requestAnimationFrame(tick)}
function pause(){playing=false;if('speechSynthesis' in window)speechSynthesis.cancel();render()}
function seek(s){t=clamp(s,0,D);lastBeat=-1;render();if(playing)speak()}

T.play.onclick=()=>playing?pause():play();
$('#bigplay').onclick=play;
$('#reset').onclick=()=>{t=0;if('speechSynthesis' in window)speechSynthesis.cancel();play()};
T.track.addEventListener('pointerdown',e=>{const r=T.track.getBoundingClientRect();started=true;seek((e.clientX-r.left)/r.width*D)});
T.track.addEventListener('keydown',e=>{if(e.key==='ArrowRight')seek(t+2);if(e.key==='ArrowLeft')seek(t-2)});
$('#subs').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);T.cap.classList.toggle('off',!on)};
$('#voz').onclick=e=>{narr=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',narr);if(narr)speak();else if('speechSynthesis' in window)speechSynthesis.cancel()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON|INPUT/.test(e.target.tagName)&&e.target!==T.track){e.preventDefault();playing?pause():play()}});
render();
</script>
</body>
</html>
